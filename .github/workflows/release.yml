name: Publish DropExplorer release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish DLL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/DropExplorer.dll \
            --title "DropExplorer $GITHUB_REF_NAME" \
            --notes "Player Auction House, inventory listing flow, equipment modifier details, repaired navigation and live mob tracking, self-contained telemetry, and collector hardening."
