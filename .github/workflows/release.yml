name: Publish AuctionHouse DropFinder release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish DLLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/AuctionHouseDropFinder.dll release/GWToolboxdll.dll \
            --title "AuctionHouse & DropFinder $GITHUB_REF_NAME" \
            --notes "Adds Auction House actions directly to the GWToolbox++ inventory right-click menu and canonical inscription, rune, and insignia dropdowns. Install both DLLs and fully restart Guild Wars. Also includes multi-currency listings, repaired navigation and live mob tracking, self-contained telemetry, and collector hardening."
