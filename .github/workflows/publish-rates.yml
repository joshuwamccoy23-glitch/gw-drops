name: Publish community rates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated aggregate
        env:
          DROP_API_URL: ${{ secrets.DROP_API_URL }}
        run: |
          test -n "$DROP_API_URL"
          curl --fail --silent --show-error "$DROP_API_URL/v1/rates?min_samples=100&window=1000" -o data/community-rates.json
          jq -e '.schema_version == 1 and (.records | type == "array")' data/community-rates.json >/dev/null
      - name: Commit changed aggregate
        run: |
          git config user.name "gw-drops-bot"
          git config user.email "gw-drops-bot@users.noreply.github.com"
          git add data/community-rates.json
          git diff --cached --quiet || git commit -m "Update community drop rates"
          git push
